<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <section class="section1">
      <h2 class="title1">Définir le mot de passe</h2>
      <form action="" method="post" id="login">
        <label for="password-set">Le mot de passe nécessite un minimum de caractères et contient au moins une lettre, des chiffres et des symboles.</label>
        <div class="pwd">
          <input
            type="password"
            placeholder="Password"
            name="password-set"
            id="password-set"
          />
          <i class="fa-solid fa-eye" id="eye"></i>
        </div>
        <input type="submit" value="Continuer" name="send" id="send" />
      </form>
    </section>
  </body>
</html>
