<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
<link rel="shortcut icon" href="favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
<link rel="manifest" href="favicon/site.webmanifest" />
    <title>AuthSystem | Register</title>
    <link rel="stylesheet" href="style.css" />
    <script src="register.js" defer></script>
  </head>
  <body>
    <section>
      <h2><i class="fa-solid fa-user-plus 2xl"></i> Inscription</h2>
      <form action="" method="post" id="register">
        <div class="user">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" name="Username" id="username" />
        </div>
        <label for="Email">Email</label>
        <input type="email" name="email" id="email" />
        <div class="info"></div>
        <label for="Password">Mot de passe</label>
        <div class="pwd">
          <input type="password" name="password" id="password" />
          <i class="fa-solid fa-eye" id="eye"></i>
        </div>
        <label for="confirm_password">Confirmez le mot de passe</label>
        <div class="confirm-pwd pwd">
          <input type="password" name="confirm_password" id="pwd" />
          <i class="fa-solid fa-eye" id="eye1"></i>
        </div>
        <p id="info"></p>
        <input type="submit" value="S'inscire" name="send" />
      </form>
    </section>
  </body>
</html>
