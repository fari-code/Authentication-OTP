<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-accueil.css" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <title>AuthSystem | Accueil</title>
  </head>
  <body>
    <header>
      <div class="logo">AuthSystem</div>

      <ul class="menu">
        <li><a href="#">ACCUEIL</a></li>
        <li><a href="#">CONSEILS</a></li>
        <li><a href="#">CONTACTS</a></li>
        <li><a href="#">BOUTIQUE</a></li>
      </ul>

      <div class="button"></div>
    </header>

    <section class="banner">
      <div class="content">
        <h1>Bonjour <span id="username"></span></h1>
        <p>Bienvenue sur votre espace sécurisé.</p>
        <a href="api/logout.php" class="btn">Se déconnecter</a>
      </div>
    </section>
    <script>
      let button = document.querySelector(".button");
      let menu = document.querySelector(".menu");

      button.onclick = function () {
        button.classList.toggle("active");
        menu.classList.toggle("active");
      };

      async function getEmail() {
        const reponse = await fetch("./api/get-session-user.php", {
          credentials: "include",
        });

        const data = await reponse.json();

        if (data.status === "success") {
          const username = document.getElementById("username");
          username.textContent = data.username;
        } else {
          window.location.href = "login.html";
        }
      }

      getEmail();
    </script>
  </body>
</html>
