<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-accueil.css">
    <title>Fond vidéo</title>
</head>
<body>
    <div class="menu">
        <div class="logo">
            <h1>Fresh fruit</h1>
        </div>
        <div class="button"></div>
        <nav class="menu">
            <a href="#">ACCEUIL</a>
            <a href="">CONSEILS</a>
            <a href="#">CONTACTS</a>
            <a href="#">BOUTIQUE</a>
        </nav>
        <div class="sign-up">
            <a href="#">S'INSCRIRE</a>
        </div>
    </div>
    <div class="banner">
        <div class="content">
            <h1>Mangé 5 fruits et légume par jour.</h1>
        </div>
    </div>
    
    <script>
        let button = document.querySelector(".button");
        let menu  =document.querySelector(".menu");
        button.onclick = function(){
            button.classList.toggle("active");
            menu.classList.toggle("active");
        }
    </script>
</body>
</html>
