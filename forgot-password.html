<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="section1">
      <h2 class="title1">Mot de passe oublié</h2>
      <form action="" method="post" id="login">
        <label for="email"
          >Saisissez l'adresse e-mail associée à votre compte. Vous recevrez
          ensuite un code de vérification pour réinitialiser votre mot de
          passe.</label
        >
        <div class="user">
          <input
            type="email"
            name="email"
            autocomplete="email"
            placeholder="Email"
            id="email"
          />
        </div>
        <input type="submit" value="Continuer" name="send" id="send" />
      </form>
    </section>
  </body>
</html>
