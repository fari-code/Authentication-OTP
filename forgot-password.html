<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
<link rel="shortcut icon" href="favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
<link rel="manifest" href="favicon/site.webmanifest" />
    <script src="forgot-password.js" defer></script>
    <title>AuthSystem | Forgot-password</title>
  </head>
  <body>
    <section class="section1">
            <div class="link-back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M18 17L10 12L18 7" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg> <a href="login.html">Retour</a></div>
      <h2 class="title1">Mot de passe oublié</h2>
      <form action="" method="post" id="forgotpassword">
        <label for="email"
          >Saisissez l'adresse e-mail associée à votre compte. Vous recevrez
          ensuite un code de vérification pour réinitialiser votre mot de
          passe.</label
        >
        <div class="user">
          <input
            type="email"
            name="email"
            autocomplete="email"
            placeholder="Email"
            id="email"
          />
        </div>
        <p id="info"></p>
        <input type="submit" value="Continuer" name="send" id="send" />
      </form>
    </section>
  </body>
</html>
